<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اطلب الآن - سلة التسوق</title>
    <link rel="shortcut icon" href="/images/pro.png" type="image/png">
    <link rel="stylesheet" href="/css/checkout.css">
</head>
<body>
    <div class="container">
        <!-- Form Section (يظهر أولاً في الموبايل) -->
        <div class="form-section">
            <!-- حالة تسجيل الدخول -->
            <div id="authStatus" class="auth-status">
                <div class="auth-message">جاري التحقق من حالة تسجيل الدخول...</div>
            </div>
            
            <div id="orderFormContainer" style="display: none;">
                <h2 class="form-title">اكمل طلبك</h2>
                <form id="orderForm">
                    <div class="input-group">
                        <label for="customerName"><span class="required">*</span> الإسم</label>
                        <input type="text" id="customerName" name="customerName" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="phoneNumber"><span class="required">*</span> رقم الهاتف</label>
                        <input type="tel" id="phoneNumber" name="phoneNumber" maxlength="11" pattern="[0-9]{11}" placeholder="07xxxxxxxxx" required>
                    </div>
                    
                    <div class="input-group">
                        <label for="address"><span class="required">*</span> العنوان</label>
                        <textarea id="address" name="address" rows="2" required></textarea>
                    </div>
                    
                    <div class="input-group">
                        <label for="notes">ملاحظاتك (اختياري)</label>
                        <textarea id="notes" name="notes" rows="2"></textarea>
                    </div>
                    
                    <div class="order-summary">
                        <div class="summary-row">
                            <span class="summary-label">المجموع:</span>
                            <span class="summary-value" id="orderTotal">0 د.ع</span>
                        </div>
                        <div class="summary-row">
                            <span class="summary-label">الكمية الإجمالية:</span>
                            <span class="summary-value" id="orderQuantity">0</span>
                        </div>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="submitBtn">إرسال الطلب</button>
                </form>
            </div>
        </div>
        
        <!-- Product Section -->
        <div class="product-section">
            <div class="product-header">
                <a href="/index.html" class="back-to-products">← العودة للتسوق</a>
                <h1 class="product-title">سلة التسوق</h1>
                <div class="cart-summary">
                    <div class="total-items" id="totalItems">0 منتج</div>
                    <div class="total-price" id="cartTotal">0 د.ع</div>
                </div>
            </div>
            
            <!-- قائمة المنتجات -->
            <div class="products-list" id="productsList">
                <!-- سيتم إنشاء القائمة القابلة للطي ديناميكياً -->
            </div>
        </div>
    </div>
    
    <!-- Modals -->
    <div class="confirmation-modal" id="confirmationModal">
        <div class="modal-content">
            <div class="confirmation-icon">✅</div>
            <div class="confirmation-title">تأكيد الطلب</div>
            <div class="confirmation-message">هل أنت متأكد من المعلومات التالية؟</div>
            <div class="confirmation-details" id="confirmationDetails"></div>
            <div class="confirmation-buttons">
                <button class="confirm-btn" id="confirmOrder">تأكيد الطلب</button>
                <button class="cancel-btn" id="cancelOrder">إلغاء</button>
            </div>
        </div>
    </div>
    
    <div class="success-modal" id="successModal">
        <div class="modal-content">
            <div class="success-icon">✓</div>
            <div class="success-title">تم إرسال طلبك بنجاح!</div>
            <div class="success-message">سيتم التواصل معك قريباً لتأكيد الطلب وتحديد موعد التوصيل</div>
            <div class="success-details" id="successDetails"></div>
            <button class="close-btn" id="closeSuccessBtn">حسناً</button>
        </div>
    </div>
    
    <script src="/js/checkout.js"></script>
</body>
</html>
