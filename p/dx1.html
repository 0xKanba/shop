<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مبردة شحن Embleme — MyOrders<title>
  <link rel="shortcut icon" href="/images/pro.webp" type="image/webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/p.css">
</head>
<body>

  <!-- ══════════════════════════════════════
       شريط ثابت في الأعلى دائماً
       ══════════════════════════════════════ -->
  <div class="sticky-bar">
    <button class="back-btn" onclick="history.back()">
      <i class="fas fa-arrow-right"></i>
    </button>

    <div class="sticky-center">
      <span class="sticky-price">160,000 <small>د.ع</small></span>
    </div>

    <div class="sticky-actions">
      <div class="qty-ctrl">
        <button onclick="changeQty(-1)">−</button>
        <span id="qty">1</span>
        <button onclick="changeQty(1)">+</button>
      </div>
      <button
        id="add-to-cart-btn"
        class="buy-btn"
        onclick="addToCart()"
        data-product-id="p1"
        data-product-name="مبردة شحن Embleme"
        data-product-price="160000">
        <i class="fas fa-cart-plus"></i>
        <span>أضف للسلة</span>
      </button>
      <a class="checkout-btn" href="/checkout.html">
        <i class="fas fa-bag-shopping"></i>
        <span>السلة</span>
      </a>
    </div>
  </div>

  <!-- ══════════════════════════════════════
       محتوى الصفحة
       ══════════════════════════════════════ -->
  <main class="page-wrap">

    <!-- 1. عنوان المنتج -->
    <div class="prod-header">
      <span class="brand-tag">Embleme</span>
      <h1 class="prod-name">مبردة شحن هوائية</h1>
      <div class="prod-price-row">
        <span class="p-val">160,000</span>
        <span class="p-cur">د.ع</span>
        <span class="p-avail">✅ متوفر</span>
      </div>
    </div>

    <!-- 2. فيديو يوتيوب عمودي -->
    <div class="video-wrap">
      <!-- استبدل eF7DSl0dlnI بمعرف الفيديو الصحيح -->
      <iframe
        src="https://www.youtube.com/embed/eF7DSl0dlnI?rel=0&modestbranding=1&playsinline=1"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
        loading="lazy">
      </iframe>
    </div>

    <!-- 3. ثلاث صور مصغرة ديناميكية -->
    <div class="thumbs-row">
      <div class="thumb-card active" onclick="openModal('/images/x1a.webp')">
        <img src="/images/x1a.webp" alt="صورة 1" loading="eager">
        <div class="thumb-overlay"><i class="fas fa-expand"></i></div>
      </div>
      <div class="thumb-card" onclick="openModal('/images/x1b.webp')">
        <img src="/images/x1b.webp" alt="صورة 2" loading="lazy">
        <div class="thumb-overlay"><i class="fas fa-expand"></i></div>
      </div>
      <div class="thumb-card" onclick="openModal('/images/x1c.webp')">
        <img src="/images/x1c.webp" alt="صورة 3" loading="lazy">
        <div class="thumb-overlay"><i class="fas fa-expand"></i></div>
      </div>
    </div>

    <!-- 4. الوصف والمواصفات -->
    <div class="desc-wrap">
      <p class="prod-desc">
        مبردة هوائية بتصميم حديث وآمن، تعمل على الشحن والكهرباء بالتناوب،
        مزودة ببطارية <strong>12V / 7Ah</strong> وخزان ماء سعة <strong>12 لتر</strong>.
        مناسبة للاستخدام المنزلي والخارجي مع ريموت للتحكم عن بعد وأربع عجلات للتنقل بسهولة.
      </p>
      <div class="cta-line">🌬️ برودة بلا انقطاع — أينما كنت!</div>
    </div>

    <div class="specs-wrap">
      <h2 class="specs-title">المواصفات</h2>
      <div class="specs-grid">
        <div class="spec"><span class="sk">🔋 البطارية</span><span class="sv">12V / 7Ah</span></div>
        <div class="spec"><span class="sk">⏱️ عمر البطارية</span><span class="sv">8 / 4 ساعات</span></div>
        <div class="spec"><span class="sk">💧 خزان الماء</span><span class="sv">12 لتر</span></div>
        <div class="spec"><span class="sk">⚡ الطاقة</span><span class="sv">60 واط</span></div>
        <div class="spec"><span class="sk">🔌 مصدر الطاقة</span><span class="sv">شحن + كهرباء</span></div>
        <div class="spec"><span class="sk">🕐 وقت الشحن</span><span class="sv">12 – 15 ساعة</span></div>
        <div class="spec"><span class="sk">💡 الإنارة</span><span class="sv">مستويان</span></div>
        <div class="spec"><span class="sk">⏲️ المؤقت</span><span class="sv">1 – 7 ساعات</span></div>
        <div class="spec"><span class="sk">🎛️ التحكم</span><span class="sv">ريموت</span></div>
        <div class="spec"><span class="sk">🛞 التنقل</span><span class="sv">أربع عجلات</span></div>
        <div class="spec"><span class="sk">📏 الأبعاد</span><span class="sv">79×38×24 سم</span></div>
        <div class="spec"><span class="sk">🛡️ الضمان</span><span class="sv">سنة كاملة</span></div>
      </div>
    </div>

  </main>

  <!-- مودال الصورة الكاملة -->
  <div id="img-modal" onclick="closeModal()">
    <div class="modal-inner" onclick="e=>e.stopPropagation()">
      <button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button>
      <img id="modal-img" src="" alt="">
    </div>
  </div>

  <script src="/js/p.js"></script>
</body>
</html>
