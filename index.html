  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>
    (function() {
      try {
        var s = localStorage.getItem('theme');
        var d = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        var t = s || (d ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.backgroundColor = t === 'dark' ? '#181b22' : '#e6ecf4';
        document.documentElement.style.colorScheme = t === 'dark' ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  <style>
    :root { color-scheme: light; }
    html[data-theme="dark"] { color-scheme: dark; }
    html, body { background-color: #e6ecf4; }
    html[data-theme="dark"], html[data-theme="dark"] body { background-color: #181b22 !important; }
  </style>
