<body><a href="javascript:history.back()" class="global-back-btn"><i class="fas fa-arrow-right"></i></a>
  <div id="stars"></div>

  <section id="panel">
    <img id="logo" src="https://i.postimg.cc/d3fS0sHg/pro.webp" alt="المحل العراقي">
    <h1><span class="g">المحل</span> العراقي</h1>

    <!-- تسجيل الدخول -->
    <form class="form active" id="loginForm">
      <input type="text" id="login-username" placeholder="اسم المستخدم" autocomplete="username" required>
      <input type="password" id="login-password" placeholder="كلمة المرور" autocomplete="current-password" required>
      <button type="submit">تسجيل الدخول</button>
      <span class="flip" data-to="signup">ليس لديك حساب؟ إنشاء حساب</span>
    </form>

    <!-- إنشاء حساب -->
    <form class="form" id="signupForm">
      <input type="text" id="signup-username" placeholder="مثال: abc" autocomplete="username" required minlength="3">
      <input type="password" id="signup-password" placeholder="مثال: abcxyz" autocomplete="new-password" required minlength="6">
      <button type="submit">إنشاء حساب</button>
      <span class="flip" data-to="login">لدي حساب بالفعل</span>
    </form>

    <div id="error" class="hidden"></div>
  </section>

  <script src="/js/enter.js?v=3"></script>
    <script src="/js/theme.js"></script>
</body>
